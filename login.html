<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistema Legislativo Integrado</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #f8fafc; }
    .login-card { background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 360px; border: 1px solid #334155; }
    .login-card h2 { text-align: center; margin-bottom: 24px; color: #38bdf8; font-size: 1.5rem; }
    label { font-size: 0.875rem; color: #94a3b8; display: block; margin-top: 12px; margin-bottom: 4px; }
    input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; }
    input:focus { outline: none; border-color: #38bdf8; }
    button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 24px; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    .error-msg { color: #f87171; font-size: 0.875rem; text-align: center; margin-top: 12px; display: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>Sistema Legislativo</h2>
    <form id="loginForm">
      <label for="username">Usuário</label>
      <input type="text" id="username" placeholder="Digite seu usuário" required>
      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="Digite sua senha" required>
      <button type="submit">Acessar Sistema</button>
      <div id="errorMsg" class="error-msg">Usuário ou senha incorretos</div>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.style.display = 'none';
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      if (res.ok) {
        window.location.href = '/';
      } else {
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
